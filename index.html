<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <meta name="keywords" content="جدول, مهام, روتين, تنظيم, وقت, إنتاجية, أذكار, عادات, تقويم, إسلام" />
    <meta name="author" content="جدول يومي" />
    <meta name="theme-color" content="#82543b" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:title" content="جدول يومي - منظم المهام والروتين اليومي" />
    <meta property="og:description" content="تطبيق إدارة المهام والروتين اليومي - نظم وقتك وأنجز مهامك بكفاءة" />
    <meta property="og:site_name" content="جدول يومي" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="جدول يومي - منظم المهام والروتين اليومي" />
    <meta name="twitter:description" content="تطبيق إدارة المهام والروتين اليومي - نظم وقتك وأنجز مهامك بكفاءة" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="جدول يومي" />

    <!-- Google Fonts - Noto Kufi Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Prevent FOUC for dark mode -->
    <script>
      try {
        var mode = localStorage.getItem("jadwal-dark-mode");
        if (mode === "true") {
          document.documentElement.classList.add("dark");
        } else if (mode === null && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
